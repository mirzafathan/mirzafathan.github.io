<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Writings | Portfolio</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <header>
            <h1>Professional Writings</h1>
            <p class="subtitle">A curated repository of my LinkedIn articles and insights.</p>
        </header>

        <!-- Navigation Buttons -->
        <nav class="theme-nav">
            <button class="theme-btn active" data-theme="architecture">Systems & Architecture</button>
            <button class="theme-btn" data-theme="llm">LLMs & Inference</button>
            <button class="theme-btn" data-theme="math">Mathematics</button>
        </nav>

        <!-- Content Sections -->
        <main id="content">
            <section id="architecture" class="theme-section active">
                <h2>Systems & Architecture</h2>
                <div class="feed-container"></div>
            </section>

            <section id="llm" class="theme-section">
                <h2>LLMs & Inference</h2>
                <div class="feed-container"></div>
            </section>

            <section id="math" class="theme-section">
                <h2>Mathematics</h2>
                <div class="feed-container"></div>
            </section>
        </main>
    </div>

    <!-- Scripts must load in this order -->
    <script src="data.js"></script>
    <script src="script.js"></script>
</body>
</html>
